services:
  control-plane:
    environment:
      - CONTROL_PLANE_DB_PATH=/data/decipher.sqlite3
      - CONTROL_PLANE_SQLITE_WAL=false
    ports:
      - "8000:8000"
    volumes:
      - ${SMOKE_DATA_DIR:-/tmp/decipher-e2e}:/data

  nautilus-runner:
    # Override base restart policy so a clean exit stays visible to docker compose ps.
    restart: "no"
    depends_on:
      control-plane:
        condition: service_healthy
