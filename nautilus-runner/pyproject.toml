[project]
name = "nautilus-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "nautilus-trader==2.0.0rc5",
  "httpx==0.27.2",
  "websockets==13.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "pyarrow==25.0.1",
]

[project.optional-dependencies]
# `backtest` is only needed by `scripts/run_backtest.py` (pandas is pulled in
# transitively by nautilus_trader.analysis.reporter.generate_positions_report).
# Keeping it out of core deps keeps the live-trading Docker image slim.
backtest = [
  "pandas==2.2.3",
]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "respx==0.21.1",
  "ruff==0.6.9",
  "pandas==2.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nautilus_runner", "strategies"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
