name: decipher-trader

networks:
  decipher:
    driver: bridge

volumes:
  decipher-db:
  decipher-cache:

services:
  control-plane:
    build:
      context: ./control-plane
    networks:
      - decipher
    env_file:
      - .env
    volumes:
      - decipher-db:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 6

  nautilus-runner:
    build:
      context: ./nautilus-runner
    networks:
      - decipher
    env_file:
      - .env
    depends_on:
      control-plane:
        condition: service_healthy
    restart: on-failure:3

  dashboard:
    build:
      context: ./dashboard
    networks:
      - decipher
    env_file:
      - .env
    environment:
      - CONTROL_PLANE_URL=http://control-plane:8000
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
