name: decipher-trader

networks:
  decipher:
    driver: bridge

volumes:
  decipher-db:
  decipher-cache:

services:
  control-plane:
    build:
      context: ./control-plane
    networks:
      - decipher
    env_file:
      - .env
    volumes:
      - decipher-db:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 6
